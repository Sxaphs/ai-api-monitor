<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}竞品监测{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; color: #1f2937; background: #f8fafc; }
    header { background: #0f172a; padding: 16px 24px; }
    header a { color: #e2e8f0; margin-right: 20px; text-decoration: none; }
    main { max-width: 1280px; margin: 24px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; vertical-align: top; }
    th { background: #f1f5f9; white-space: nowrap; }
    form.filters { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 16px; }
    label { display: grid; gap: 4px; font-size: 13px; }
    select, button, input { padding: 7px 10px; }
    button { cursor: pointer; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; background: #e2e8f0; font-size: 12px; }
    .high { background: #fee2e2; color: #991b1b; }
    .medium { background: #fef3c7; color: #92400e; }
    .low { background: #dcfce7; color: #166534; }
    .summary { min-width: 280px; white-space: pre-wrap; word-break: break-word; }
    .actions, .preset-actions { display: flex; gap: 8px; }
    .preset-actions { margin-bottom: 20px; }
    .empty { padding: 32px; background: white; text-align: center; }
    .error { padding: 12px; background: #fee2e2; color: #991b1b; }
    .report-content { padding: 24px; background: white; line-height: 1.7; overflow-x: auto; }
    .report-content table { margin: 12px 0 24px; }
    .report-content blockquote { margin-left: 0; padding-left: 12px; border-left: 3px solid #f59e0b; }
    .markdown-source { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
<header><nav><a href="/changes">变动记录</a><a href="/review">人工核对</a><a href="/reports">报告</a></nav></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
